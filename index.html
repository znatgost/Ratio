<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ratio — Aspect Ratio Tool</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e0e'/%3E%3Crect x='5' y='9' width='22' height='14' rx='2' fill='none' stroke='%23d4ff4e' stroke-width='2'/%3E%3Cline x1='16' y1='9' x2='16' y2='23' stroke='%23d4ff4e' stroke-width='1' opacity='.35'/%3E%3Cline x1='5' y1='16' x2='27' y2='16' stroke='%23d4ff4e' stroke-width='1' opacity='.35'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #d4ff4e;
    --accent-dim: rgba(212,255,78,0.12);
    --text: #f0f0f0;
    --text-muted: #6b6b6b;
    --handle-size: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 36px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
  }

  .logo {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    color: var(--accent);
  }

  .logo span {
    color: var(--text-muted);
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    font-style: normal;
    margin-left: 10px;
    vertical-align: middle;
    letter-spacing: 0.06em;
  }

  .header-hint {
    color: var(--text-muted);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* LAYOUT */
  .app {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* PRESET GROUPS */
  .preset-group { }
  .presets-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .preset-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    gap: 10px;
  }

  .preset-btn:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .preset-btn.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .preset-name { flex: 1; }
  .preset-ratio {
    color: var(--text-muted);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
  }
  .preset-btn.active .preset-ratio { color: var(--accent); opacity: 0.7; }

  .preset-thumb {
    width: 28px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .preset-thumb-inner {
    background: currentColor;
    opacity: 0.25;
    border-radius: 2px;
  }

  /* DIVIDER */
  .sidebar-divider {
    height: 1px;
    background: var(--border);
  }

  /* INPUTS */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .input-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    width: 16px;
    flex-shrink: 0;
  }

  .dim-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .dim-input:focus {
    border-color: var(--accent);
  }

  .input-unit {
    color: var(--text-muted);
    font-size: 0.65rem;
    width: 20px;
    flex-shrink: 0;
  }

  .lock-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
    width: 100%;
    justify-content: center;
  }

  .lock-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lock-btn.locked { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .lock-icon { font-size: 0.8rem; }

  /* STATS PANEL */
  .stats-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat-key {
    color: var(--text-muted);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stat-val {
    color: var(--text);
    font-size: 0.78rem;
  }

  .stat-val.accent { color: var(--accent); font-size: 1rem; letter-spacing: -0.02em; }

  /* CANVAS AREA */
  .canvas-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(212,255,78,0.03) 0%, transparent 60%),
      var(--bg);
  }

  /* Grid dots */
  .canvas-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #2a2a2a 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.7;
    pointer-events: none;
  }

  /* RESIZABLE BOX */
  .box-wrapper {
    position: relative;
    z-index: 2;
  }

  .ratio-box {
    position: relative;
    background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%);
    border: 2px solid var(--border);
    border-radius: 4px;
    transition: border-color 0.2s;
    cursor: default;
    user-select: none;
    min-width: 60px;
    min-height: 40px;
  }

  .ratio-box.dragging {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 20px 60px rgba(0,0,0,0.5);
  }

  /* Crosshair lines */
  .ratio-box::before,
  .ratio-box::after {
    content: '';
    position: absolute;
    pointer-events: none;
    opacity: 0.08;
  }
  .ratio-box::before {
    left: 50%; top: 10%; bottom: 10%;
    width: 1px;
    background: var(--text);
    transform: translateX(-50%);
  }
  .ratio-box::after {
    top: 50%; left: 10%; right: 10%;
    height: 1px;
    background: var(--text);
    transform: translateY(-50%);
  }

  /* RATIO LABEL inside box */
  .box-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 3;
  }

  .box-ratio-text {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 5vw, 3.5rem);
    color: var(--text);
    opacity: 0.9;
    line-height: 1;
    white-space: nowrap;
  }

  .box-dims-text {
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.55rem, 1.2vw, 0.72rem);
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  /* RULER LINES */
  .ruler-w, .ruler-h {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    z-index: 4;
  }

  .ruler-w {
    left: 0; right: 0;
    bottom: calc(100% + 14px);
    flex-direction: row;
  }

  .ruler-h {
    top: 0; bottom: 0;
    left: calc(100% + 14px);
    flex-direction: column;
  }

  .ruler-line {
    background: var(--border);
    flex: 1;
  }
  .ruler-w .ruler-line { height: 1px; }
  .ruler-h .ruler-line { width: 1px; }

  .ruler-w::before, .ruler-w::after,
  .ruler-h::before, .ruler-h::after {
    content: '';
    width: 1px;
    height: 6px;
    background: var(--border);
    display: block;
  }
  .ruler-h::before, .ruler-h::after {
    width: 6px;
    height: 1px;
  }

  /* RESIZE HANDLES */
  .handle {
    position: absolute;
    width: var(--handle-size);
    height: var(--handle-size);
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    z-index: 10;
  }

  .handle:hover, .handle.active {
    border-color: var(--accent);
    background: var(--accent);
    transform: scale(1.3);
  }

  .handle-se { bottom: calc(var(--handle-size) / -2); right: calc(var(--handle-size) / -2); cursor: nwse-resize; }
  .handle-sw { bottom: calc(var(--handle-size) / -2); left: calc(var(--handle-size) / -2); cursor: nesw-resize; }
  .handle-ne { top: calc(var(--handle-size) / -2); right: calc(var(--handle-size) / -2); cursor: nesw-resize; }
  .handle-nw { top: calc(var(--handle-size) / -2); left: calc(var(--handle-size) / -2); cursor: nwse-resize; }
  .handle-n  { top: calc(var(--handle-size) / -2); left: 50%; transform: translateX(-50%); cursor: ns-resize; }
  .handle-s  { bottom: calc(var(--handle-size) / -2); left: 50%; transform: translateX(-50%); cursor: ns-resize; }
  .handle-e  { right: calc(var(--handle-size) / -2); top: 50%; transform: translateY(-50%); cursor: ew-resize; }
  .handle-w  { left: calc(var(--handle-size) / -2); top: 50%; transform: translateY(-50%); cursor: ew-resize; }

  .handle-n:hover, .handle-s:hover, .handle-n.active, .handle-s.active {
    transform: translateX(-50%) scale(1.3);
  }
  .handle-e:hover, .handle-w:hover, .handle-e.active, .handle-w.active {
    transform: translateY(-50%) scale(1.3);
  }

  /* MATCH INDICATOR */
  .match-badge {
    position: absolute;
    bottom: calc(100% + 48px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #0e0e0e;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .match-badge.visible { opacity: 1; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #0e0e0e;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 8px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  @media (max-width: 640px) {
    header {
      padding: 14px 18px;
    }
    .logo span { display: none; }
    .header-hint { display: none; }

    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 44vh 1fr;
    }

    /* Canvas on top */
    .canvas-area { order: -1; min-height: 44vh; }

    /* Sidebar becomes bottom panel */
    .sidebar {
      border-right: none;
      border-top: 1px solid var(--border);
      padding: 16px;
      gap: 16px;
      overflow-y: auto;
      max-height: calc(56vh - 56px);
    }

    /* Presets: horizontal scrollable strip */
    .presets-grid {
      flex-direction: row;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .presets-grid::-webkit-scrollbar { display: none; }

    .preset-btn {
      flex-shrink: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 8px 10px;
      min-width: 100px;
    }
    .preset-thumb { display: none; }
    .preset-ratio { font-size: 0.72rem; }

    /* Dimensions: side by side */
    .input-group { flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .input-row { flex: 1; min-width: 100px; }
    .lock-btn { width: 100%; }

    /* Stats: 2-column grid */
    .stats-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
    }
    .stat-val.accent { font-size: 0.9rem; }

    /* Rulers: hide on mobile (cluttered) */
    .ruler-w, .ruler-h { display: none; }

    /* Match badge: position inside canvas */
    .match-badge { bottom: calc(100% + 20px); font-size: 0.6rem; }

    /* Bigger touch handles */
    :root { --handle-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Ratio <span>aspect ratio tool</span></div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="header-hint">drag the corners to resize</div>
    <a href="https://github.com/znatgost" target="_blank" rel="noopener" style="color:var(--text-muted);transition:color 0.15s;display:flex" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.341-3.369-1.341-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
    </a>
    <a href="https://x.com/znatgost" target="_blank" rel="noopener" style="color:var(--text-muted);transition:color 0.15s;display:flex" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-muted)'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg>
    </a>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="preset-group">
      <div class="section-label">Presets</div>
      <div class="presets-grid" id="presets"></div>
    </div>

    <div class="sidebar-divider"></div>

    <div>
      <div class="section-label">Dimensions</div>
      <div class="input-group">
        <div class="input-row">
          <span class="input-label">W</span>
          <input class="dim-input" id="inW" type="number" value="1920">
          <span class="input-unit">px</span>
        </div>
        <div class="input-row">
          <span class="input-label">H</span>
          <input class="dim-input" id="inH" type="number" value="1080">
          <span class="input-unit">px</span>
        </div>
        <button class="lock-btn" id="lockBtn">
          <span class="lock-icon">🔓</span> Free resize
        </button>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <div>
      <div class="section-label">Info</div>
      <div class="stats-panel">
        <div class="stat-row">
          <span class="stat-key">Ratio</span>
          <span class="stat-val accent" id="statRatio">16:9</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">Decimal</span>
          <span class="stat-val" id="statDecimal">1.778</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">Width</span>
          <span class="stat-val" id="statW">640 px</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">Height</span>
          <span class="stat-val" id="statH">360 px</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">Area</span>
          <span class="stat-val" id="statArea">230,400 px²</span>
        </div>
        <div class="stat-row">
          <span class="stat-key">Diagonal</span>
          <span class="stat-val" id="statDiag">734 px</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- CANVAS -->
  <main class="canvas-area" id="canvas">
    <div class="box-wrapper" id="boxWrapper">
      <div class="ratio-box" id="box">
        <!-- handles -->
        <div class="handle handle-nw" data-dir="nw"></div>
        <div class="handle handle-n"  data-dir="n"></div>
        <div class="handle handle-ne" data-dir="ne"></div>
        <div class="handle handle-e"  data-dir="e"></div>
        <div class="handle handle-se" data-dir="se"></div>
        <div class="handle handle-s"  data-dir="s"></div>
        <div class="handle handle-sw" data-dir="sw"></div>
        <div class="handle handle-w"  data-dir="w"></div>

        <!-- label -->
        <div class="box-label">
          <div class="box-ratio-text" id="boxRatioText">16:9</div>
          <div class="box-dims-text"  id="boxDimsText">640 × 360</div>
        </div>

        <!-- rulers -->
        <div class="ruler-w">
          <div class="ruler-line"></div>
          <span id="rulerW">640 px</span>
          <div class="ruler-line"></div>
        </div>
        <div class="ruler-h">
          <div class="ruler-line"></div>
          <span id="rulerH">360 px</span>
          <div class="ruler-line"></div>
        </div>
      </div>

      <div class="match-badge" id="matchBadge">✦ exact match</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const PRESETS = [
  { name: '1:1 Square',      w: 1,   h: 1   },
  { name: '4:3 Classic',     w: 4,   h: 3   },
  { name: '3:2 Photo',       w: 3,   h: 2   },
  { name: '16:9 Widescreen', w: 16,  h: 9   },
  { name: '21:9 Ultrawide',  w: 21,  h: 9   },
  { name: '9:16 Portrait',   w: 9,   h: 16  },
  { name: '2:3 Portrait',    w: 2,   h: 3   },
  { name: '4:5 Social',      w: 4,   h: 5   },
  { name: '3:1 Panorama',    w: 3,   h: 1   },
  { name: '2:1 Univisium',   w: 2,   h: 1   },
  { name: '1.85:1 Cinema',   w: 37,  h: 20  },
  { name: '2.39:1 Scope',    w: 239, h: 100 },
  { name: '5:4 Monitor',     w: 5,   h: 4   },
  { name: 'A4 Paper',        w: 210, h: 297 },
  { name: 'A4 Landscape',    w: 297, h: 210 },
];

// --- STATE ---
// logW/logH: logical pixel dimensions shown to user (1–10000)
// visW/visH: actual screen px size of the rendered box
let logW = 1920, logH = 1080;
let visW = 640,  visH = 360;

// When locked, ratio is stored as exact integers to avoid float drift
let locked  = false;
let lockRW  = 16, lockRH = 9; // canonical simplified ratio integers

// --- DOM ---
const canvas       = document.getElementById('canvas');
const box          = document.getElementById('box');
const inW          = document.getElementById('inW');
const inH          = document.getElementById('inH');
const lockBtn      = document.getElementById('lockBtn');
const boxRatioText = document.getElementById('boxRatioText');
const boxDimsText  = document.getElementById('boxDimsText');
const rulerW       = document.getElementById('rulerW');
const rulerH       = document.getElementById('rulerH');
const statRatio    = document.getElementById('statRatio');
const statDecimal  = document.getElementById('statDecimal');
const statW        = document.getElementById('statW');
const statH        = document.getElementById('statH');
const statArea     = document.getElementById('statArea');
const statDiag     = document.getElementById('statDiag');
const matchBadge   = document.getElementById('matchBadge');
const toast        = document.getElementById('toast');

// --- MATH ---
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

function simplifyRatio(w, h) {
  const wi = Math.round(w), hi = Math.round(h);
  if (wi <= 0 || hi <= 0) return [wi, hi];
  const g = gcd(wi, hi);
  return [wi / g, hi / g];
}

function formatRatio(w, h) {
  const [sw, sh] = simplifyRatio(w, h);
  if (sw > 999 || sh > 999) return (w / h).toFixed(3) + ':1';
  return `${sw}:${sh}`;
}

// --- LAYOUT ---
function getMaxVis() {
  const r = canvas.getBoundingClientRect();
  const cw = r.width  || 900;
  const ch = r.height || 600;
  return { maxVW: Math.max(80, cw - 160), maxVH: Math.max(60, ch - 160) };
}

// Recalculate visW/visH to fit canvas while preserving logW/logH ratio
function fitVisToLog() {
  const { maxVW, maxVH } = getMaxVis();
  const ratio = logW / logH;
  let scale = Math.min(maxVW / logW, maxVH / logH, 1);
  let vW = Math.round(logW * scale);
  let vH = Math.round(logH * scale);

  // Enforce minimum visual size while preserving the actual ratio
  if (vW < 60) { vW = 60; vH = Math.round(vW / ratio); }
  if (vH < 40) { vH = 40; vW = Math.round(vH * ratio); }

  visW = vW;
  visH = vH;
}

// --- APPLY ---
function applyLogical(lw, lh) {
  if (locked) {
    // Minimum must be at least lockRW so lh = round(lw*lockRH/lockRW) stays exact
    lw = Math.max(lockRW, Math.min(10000, Math.round(lw)));
    lh = Math.round(lw * lockRH / lockRW);
    if (lh > 10000) {
      lh = 10000;
      lw = Math.max(lockRW, Math.min(10000, Math.round(lh * lockRW / lockRH)));
    }
    logW = lw; logH = lh;
  } else {
    logW = Math.max(1, Math.min(10000, Math.round(lw)));
    logH = Math.max(1, Math.min(10000, Math.round(lh)));
  }
  fitVisToLog();
  box.style.width  = visW + 'px';
  box.style.height = visH + 'px';
  updateUI();
}

// --- UI UPDATE ---
function checkPresetMatch() {
  const ratio = logW / logH;
  for (const p of PRESETS) {
    if (Math.abs(ratio - p.w / p.h) < 0.005) {
      matchBadge.textContent = `✦ ${p.name}`;
      matchBadge.classList.add('visible');
      return;
    }
  }
  matchBadge.classList.remove('visible');
}

function updateUI() {
  // When locked: always display the canonical locked ratio (no float drift)
  // When free:   compute from actual logical dimensions
  const ratioStr = locked
    ? `${lockRW}:${lockRH}`
    : formatRatio(logW, logH);

  boxRatioText.textContent = ratioStr;
  boxDimsText.textContent  = `${logW.toLocaleString()} × ${logH.toLocaleString()}`;
  rulerW.textContent = `${logW.toLocaleString()} px`;
  rulerH.textContent = `${logH.toLocaleString()} px`;

  if (activeInput !== 'w') inW.value = logW;
  if (activeInput !== 'h') inH.value = logH;

  statRatio.textContent   = ratioStr;
  statDecimal.textContent = (logW / logH).toFixed(4);
  statW.textContent       = `${logW.toLocaleString()} px`;
  statH.textContent       = `${logH.toLocaleString()} px`;
  statArea.textContent    = (logW * logH).toLocaleString() + ' px²';
  statDiag.textContent    = Math.round(Math.sqrt(logW * logW + logH * logH)).toLocaleString() + ' px';

  checkPresetMatch();

  const ratio = logW / logH;
  document.querySelectorAll('.preset-btn').forEach(btn => {
    const p = PRESETS[+btn.dataset.idx];
    btn.classList.toggle('active', Math.abs(ratio - p.w / p.h) < 0.005);
  });

  // Font size relative to visual box
  const minVis = Math.min(visW, visH);
  boxRatioText.style.fontSize = Math.max(14, Math.min(56, minVis * 0.18)) + 'px';
  boxDimsText.style.fontSize  = Math.max(9,  Math.min(13, minVis * 0.04)) + 'px';
}

// --- PRESETS ---
function buildPresets() {
  const grid = document.getElementById('presets');
  PRESETS.forEach((p, idx) => {
    const pr    = p.w / p.h;
    const thumbW = Math.min(28, Math.round(28 * Math.min(1, pr)));
    const thumbH = Math.min(18, Math.round(18 * Math.min(1, 1 / pr)));
    const btn   = document.createElement('button');
    btn.className   = 'preset-btn';
    btn.dataset.idx = idx;
    btn.innerHTML = `
      <span class="preset-name">${p.name}</span>
      <span class="preset-ratio">${p.w}:${p.h}</span>
      <span class="preset-thumb">
        <span class="preset-thumb-inner" style="width:${thumbW}px;height:${thumbH}px"></span>
      </span>`;
    btn.addEventListener('click', () => applyPreset(p));
    grid.appendChild(btn);
  });
}

function applyPreset(p) {
  // Pick a clean logical size (e.g. 1920×1080 for 16:9)
  let lw, lh;
  if (p.w / p.h >= 1) {
    lw = 1920;
    lh = Math.round(lw * p.h / p.w);
    lw = Math.round(lh * p.w / p.h); // re-derive to ensure exact integer ratio
  } else {
    lh = 1920;
    lw = Math.round(lh * p.w / p.h);
    lh = Math.round(lw * p.h / p.w);
  }
  // If locked, update the canonical lock ratio to this preset
  if (locked) { lockRW = p.w; lockRH = p.h; }
  applyLogical(lw, lh);
  showToast(`Applied ${p.name}`);
}

// --- TOAST ---
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

// --- LOCK ---
lockBtn.addEventListener('click', () => {
  locked = !locked;
  if (locked) {
    // Snap logical dims to exactly match a clean integer ratio
    const [sw, sh] = simplifyRatio(logW, logH);
    if (sw <= 999 && sh <= 999) {
      lockRW = sw; lockRH = sh;
    } else {
      // Try matching a known preset
      const ratio = logW / logH;
      let best = null, bestDiff = Infinity;
      for (const p of PRESETS) {
        const d = Math.abs(p.w / p.h - ratio);
        if (d < bestDiff) { bestDiff = d; best = p; }
      }
      lockRW = (best && bestDiff < 0.02) ? best.w : sw;
      lockRH = (best && bestDiff < 0.02) ? best.h : sh;
    }
  }
  lockBtn.classList.toggle('locked', locked);
  lockBtn.innerHTML = locked
    ? '<span class="lock-icon">🔒</span> Ratio locked'
    : '<span class="lock-icon">🔓</span> Free resize';
  updateUI();
});

// --- INPUTS ---
// Track which input is focused so updateUI doesn't overwrite while typing
let activeInput = null;

inW.addEventListener('focus', () => { activeInput = 'w'; });
inH.addEventListener('focus', () => { activeInput = 'h'; });

inW.addEventListener('blur', () => {
  activeInput = null;
  const lw = Math.max(1, Math.min(10000, parseInt(inW.value) || 1));
  if (locked) applyLogical(lw, Math.round(lw * lockRH / lockRW));
  else        applyLogical(lw, logH);
});

inH.addEventListener('blur', () => {
  activeInput = null;
  const lh = Math.max(1, Math.min(10000, parseInt(inH.value) || 1));
  if (locked) {
    // When H is the input, derive W from H, then let applyLogical re-confirm
    const lw = Math.max(lockRW, Math.round(lh * lockRW / lockRH));
    applyLogical(lw, Math.round(lw * lockRH / lockRW));
  } else {
    applyLogical(logW, lh);
  }
});

inW.addEventListener('input', () => {
  const lw = parseInt(inW.value);
  if (!lw || lw < 1) return; // incomplete number, wait for blur
  const cw = Math.min(10000, lw);
  // updateUI won't touch inW because activeInput === 'w'
  if (locked) applyLogical(cw, Math.round(cw * lockRH / lockRW));
  else        applyLogical(cw, logH);
});

inH.addEventListener('input', () => {
  const lh = parseInt(inH.value);
  if (!lh || lh < 1) return;
  const ch = Math.min(10000, lh);
  if (locked) applyLogical(Math.round(ch * lockRW / lockRH), ch);
  else        applyLogical(logW, ch);
});

inW.addEventListener('keydown', e => { if (e.key === 'Enter') inW.blur(); });
inH.addEventListener('keydown', e => { if (e.key === 'Enter') inH.blur(); });

// --- DRAG HANDLES ---
let dragState = null;

box.querySelectorAll('.handle').forEach(handle => {
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    startDrag(e.clientX, e.clientY, handle);
  });
  handle.addEventListener('touchstart', e => {
    e.preventDefault();
    startDrag(e.touches[0].clientX, e.touches[0].clientY, handle);
  }, { passive: false });
});

function startDrag(cx, cy, handle) {
  handle.classList.add('active');
  box.classList.add('dragging');
  // viewScale: logical px per screen px (constant during this drag)
  const viewScale = logW / visW;
  dragState = {
    dir: handle.dataset.dir,
    startX: cx, startY: cy,
    startLogW: logW, startLogH: logH,
    viewScale,
    handle,
  };
}

function onMove(cx, cy) {
  if (!dragState) return;
  const { dir, startX, startY, startLogW, startLogH, viewScale } = dragState;

  // Convert screen delta → logical delta
  const dLx = (cx - startX) * viewScale;
  const dLy = (cy - startY) * viewScale;

  let newLW = startLogW, newLH = startLogH;

  if (dir.includes('e')) newLW = startLogW + dLx;
  if (dir.includes('w')) newLW = startLogW - dLx;
  if (dir.includes('s')) newLH = startLogH + dLy;
  if (dir.includes('n')) newLH = startLogH - dLy;

  // Single-axis handles keep the other dimension fixed
  if (dir === 'n' || dir === 's') newLW = startLogW;
  if (dir === 'e' || dir === 'w') newLH = startLogH;

  if (locked) {
    // Enforce exact integer ratio — no float drift
    if (dir === 'n' || dir === 's') {
      newLW = Math.round(newLH * lockRW / lockRH);
    } else if (dir === 'e' || dir === 'w') {
      newLH = Math.round(newLW * lockRH / lockRW);
    } else {
      // corner: average scale factor, then derive H from canonical ratio
      const s = ((newLW / startLogW) + (newLH / startLogH)) / 2;
      newLW = Math.round(startLogW * s);
      newLH = Math.round(newLW * lockRH / lockRW);
    }
  }

  applyLogical(newLW, newLH);
}

document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e => {
  if (dragState) onMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

function onUp() {
  if (dragState) {
    dragState.handle.classList.remove('active');
    dragState = null;
  }
  box.classList.remove('dragging');
}
document.addEventListener('mouseup', onUp);
document.addEventListener('touchend', onUp);

// --- INIT ---
buildPresets();

window.addEventListener('resize', () => {
  fitVisToLog();
  box.style.width  = visW + 'px';
  box.style.height = visH + 'px';
  updateUI();
});

window.addEventListener('load', () => {
  setTimeout(() => applyLogical(1920, 1080), 50);
});

applyLogical(1920, 1080);
</script>
</body>
</html>
